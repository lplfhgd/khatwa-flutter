name: khatwa
version: 0.1.0+1
description: Khatwa - parent and child communication and routine support app MVP.
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  get: ^4.7.3
  flutter_secure_storage: ^10.3.4
  google_fonts: ^8.1.0
  audioplayers: ^6.7.1
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  record: ^6.2.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^20.1.0
  uuid: ^4.6.0
  youtube_player_flutter: ^9.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/khatwa_logo.png
    - assets/images/
    - assets/images/parent/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/parent/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/parent/logo.png"
  min_sdk_android: 21 
